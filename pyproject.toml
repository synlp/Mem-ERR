[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memerr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.3,<13",
  "pycocoevalcap==1.2",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "torchxrayvision==1.3.4",
  "transformers==4.46.3"
]

[tool.setuptools]
packages = ["memerr"]
